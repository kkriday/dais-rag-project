services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pg_m02
    environment:
      POSTGRES_USER: m02
      POSTGRES_PASSWORD: m02pass
      POSTGRES_DB: m02db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: m02_app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://m02:m02pass@postgres:5432/m02db
    volumes:
      - ./data:/app/data
    command: python -m app.main

volumes:
  pgdata:
